<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Clases</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    padding:20px;
}

.modelo{
    background:white;
    padding:20px;
    border-radius:10px;
}

.titulo{
    font-size:24px;
    margin-bottom:20px;
}

.contenedor{
    display:flex;
    gap:20px;
}

.sidebar{
    width:220px;
    background:#2c3e50;
    color:white;
    padding:20px;
    border-radius:10px;
}

.sidebar ul{
    list-style:none;
    padding:0;
}

.sidebar li{
    padding:10px 0;
}

.contenido{
    flex:1;
    background:#ecf0f1;
    padding:20px;
    border-radius:10px;
}

button{
    padding:10px 15px;
    margin-bottom:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

table th,
table td{
    border:1px solid #ccc;
    padding:10px;
}

</style>

</head>
<body>

<div class="modelo">

<div class="titulo">
Modelo de Presentación - Clases
</div>

<div class="contenedor">

<div class="sidebar">

<h3>Menú</h3>

<ul>

<li>Inicio</li>
<li>Usuarios</li>
<li>Cursos</li>
<li>Asistencia</li>
<li>Tareas</li>
<li>Cuestionarios</li>
<li>Reportes</li>

</ul>

</div>

<div class="contenido">

<h2>Gestión de Clases</h2>

<button>Nueva Clase</button>

<table>

<tr>

<th>Título</th>
<th>Curso</th>
<th>Fecha</th>
<th>Estado</th>

</tr>

<tr>

<td>Clase 1</td>
<td>Primera Comunión</td>
<td>10/05/2026</td>
<td>Realizada</td>

</tr>

<tr>

<td>Clase 2</td>
<td>Confirmación</td>
<td>15/05/2026</td>
<td>Pendiente</td>

</tr>

</table>

</div>

</div>

</div>

</body>
</html>
