{% extends 'base.html' %}
{% load static %}

{% block title %}Recuperar contraseña{% endblock %}

{% block content %}

<style>
    body {
        background: url("/static/imagenes/fondo1.png") no-repeat center center fixed;
        background-size: cover;
        height: 100vh;
    }

    .recover-wrapper {
        min-height: 85vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card-recover {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 15px;
        padding: 30px;
        backdrop-filter: blur(10px);
        width: 100%;
        max-width: 400px;
        color: white;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
    }

    .input-group-text {
        background: rgba(255, 255, 255, 0.2);
        border: none;
        color: white;
        padding: 12px;
    }

    .form-control {
        background: rgba(255, 255, 255, 0.2);
        border: none;
        color: white;
        border-radius: 10px;
    }

    .form-control::placeholder {
        color: rgba(255, 255, 255, 0.7);
    }

    .form-control:focus {
        background: rgba(255, 255, 255, 0.2);
        color: white;
        box-shadow: none;
        border-color: white;
    }

    .btn-primary {
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid white;
        color: white;
        border-radius: 25px;
        box-shadow: 0px 4px 15px rgba(255, 255, 255, 0.3);
        transition: all 0.3s ease-in-out;
    }

    .btn-primary:hover {
        background: rgba(255, 255, 255, 0.4);
        box-shadow: 0px 6px 20px rgba(255, 255, 255, 0.5);
    }

    a {
        color: white;
        text-decoration: none;
    }
</style>

<!-- Boxicons -->
<script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>

<div class="recover-wrapper">

    <div class="card-recover">

        <h2 class="mb-3">Recuperar contraseña</h2>
        <p class="small">Ingresa tu correo o usuario para enviarte el enlace</p>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3 input-group">
                <span class="input-group-text">
                    <box-icon type='solid' name='envelope'></box-icon>
                </span>

                <!-- MISMO NAME = dato (no cambiado) -->
                <input type="text"
                       name="dato"
                       class="form-control"
                       placeholder="Correo o nombre de usuario"
                       required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Enviar enlace
            </button>
        </form>

        <div class="mt-3">
            <a href="{% url 'login' %}">← Volver al login</a>
        </div>

    </div>

</div>

{% endblock %}
