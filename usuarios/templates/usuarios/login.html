{% extends 'base.html' %}
{% load static %}

{% block title %}Login{% endblock %}

{% block content %}

<style>
    body {
        background: url("/static/imagenes/fondo1.png") no-repeat center center fixed;
        background-size: cover;
        height: 100vh;
    }

    .login-wrapper {
        min-height: 85vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card-login {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 15px;
        padding: 30px;
        backdrop-filter: blur(10px);
        width: 100%;
        max-width: 400px;
        color: white;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
    }

    .input-group-text {
        background: rgba(255, 255, 255, 0.2);
        border: none;
        color: white;
        padding: 12px;
        cursor: pointer;
    }

    .form-control {
        background: rgba(255, 255, 255, 0.2);
        border: none;
        color: white;
        border-radius: 10px;
    }

    .form-control::placeholder {
        color: rgba(255, 255, 255, 0.7);
    }

    .form-control:focus {
        background: rgba(255, 255, 255, 0.2);
        color: white;
        box-shadow: none;
        border-color: white;
    }

    .btn-primary {
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid white;
        color: white;
        border-radius: 25px;
        box-shadow: 0px 4px 15px rgba(255, 255, 255, 0.3);
        transition: all 0.3s ease-in-out;
    }

    .btn-primary:hover {
        background: rgba(255, 255, 255, 0.4);
        box-shadow: 0px 6px 20px rgba(255, 255, 255, 0.5);
    }

    a {
        color: white;
        text-decoration: none;
    }
</style>

<!-- Boxicons -->
<script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>

<div class="login-wrapper">

    <div class="card-login">

        <h2 class="mb-3">Iniciar Sesión</h2>

        <!-- MENSAJES (igual que antes) -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <!-- USUARIO -->
            <div class="mb-3 input-group">
                <span class="input-group-text">
                    <box-icon type='solid' name='user'></box-icon>
                </span>
                <input type="text" name="username" class="form-control" placeholder="Usuario" required>
            </div>

            <!-- PASSWORD -->
            <div class="mb-3 input-group">
                <span class="input-group-text" onclick="togglePassword('password', this)">
                    <box-icon type='solid' name='lock'></box-icon>
                </span>
                <input type="password" name="password" id="password" class="form-control" placeholder="Contraseña" required>
            </div>

            <!-- BOTÓN -->
            <button type="submit" class="btn btn-primary w-100">
                Ingresar
            </button>

            <!-- LINKS (mismos de antes) -->
            <div class="mt-3">
                <a href="{% url 'password_reset' %}">¿Olvidaste tu contraseña?</a> |
                <a href="{% url 'registro' %}">Crear cuenta</a>
            </div>

        </form>

    </div>

</div>

<script>
function togglePassword(id, element) {
    let input = document.getElementById(id);
    let icon = element.querySelector('box-icon');

    if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('name', 'lock-open');
    } else {
        input.type = 'password';
        icon.setAttribute('name', 'lock');
    }
}
</script>

{% endblock %}
