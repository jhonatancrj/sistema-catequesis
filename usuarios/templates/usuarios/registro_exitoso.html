{% extends 'base.html' %}
{% load static %}

{% block title %}Registro exitoso{% endblock %}

{% block content %}

<style>
    body {
        background: url("/static/imagenes/fondo1.png") no-repeat center center fixed;
        background-size: cover;
        height: 100vh;
    }

    .wrapper {
        min-height: 85vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card-glass {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        border-radius: 15px;
        padding: 35px;
        width: 100%;
        max-width: 400px;
        color: white;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0px 4px 15px rgba(0,0,0,0.2);
    }

    .btn-primary {
        background: rgba(255,255,255,.2);
        border: 1px solid white;
        border-radius: 25px;
        color: white;
        margin-top: 15px;
    }

    .btn-primary:hover {
        background: rgba(255,255,255,.35);
    }
</style>

<div class="wrapper">

    <div class="card-glass">

        <h4 class="mb-3">✅ Registro exitoso</h4>

        <p>
            Revisa tu correo para activar tu cuenta.
        </p>

        <a href="{% url 'login' %}" class="btn btn-primary w-100">
            Ir al login
        </a>

    </div>

</div>

{% endblock %}
