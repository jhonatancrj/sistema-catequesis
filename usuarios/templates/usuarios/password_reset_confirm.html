{% extends 'base.html' %}
{% load static %}

{% block title %}Nueva contraseña{% endblock %}

{% block content %}

<style>
    body {
        background: url("/static/imagenes/fondo1.png") no-repeat center center fixed;
        background-size: cover;
        height: 100vh;
    }

    .login-wrapper {
        min-height: 85vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .card-login {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 15px;
        padding: 30px;
        backdrop-filter: blur(10px);
        width: 100%;
        max-width: 400px;
        color: white;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .input-group-text {
        background: rgba(255, 255, 255, 0.2);
        border: none;
        color: white;
        padding: 12px;
        cursor: pointer;
    }

    .form-control {
        background: rgba(255, 255, 255, 0.2);
        border: none;
        color: white;
    }

    .btn-primary {
        background: rgba(255, 255, 255, 0.2);
        border: 1px solid white;
        border-radius: 25px;
        color: white;
    }

    /* 🔴 NOTIFICACIONES */
    .alert-custom {
        padding: 8px;
        border-radius: 8px;
        font-size: 14px;
        margin-bottom: 10px;
    }

    .error {
        background: rgba(255,0,0,0.25);
    }

    .success {
        background: rgba(0,255,120,0.25);
    }
</style>

<script src="https://unpkg.com/boxicons@2.1.4/dist/boxicons.js"></script>

<div class="login-wrapper">

    <div class="card-login">

        <h2 class="mb-3">Nueva contraseña 🔐</h2>

        <!-- 🔴 ERRORES DJANGO -->
        {% if form.errors %}
            {% for field in form %}
                {% for error in field.errors %}
                    <div class="alert-custom error">
                        {{ error }}
                    </div>
                {% endfor %}
            {% endfor %}
        {% endif %}

        <!-- 🔴 MENSAJES JS -->
        <div id="msg"></div>

        <form method="POST" onsubmit="return validarPasswords()">
            {% csrf_token %}

            <!-- PASSWORD 1 -->
            <div class="mb-3 input-group">
                <span class="input-group-text" onclick="togglePassword('pass1', this)">
                    <box-icon name='lock'></box-icon>
                </span>
                <input type="password" id="pass1" name="password1"
                       class="form-control"
                       placeholder="Nueva contraseña"
                       onkeyup="checkStrength()"
                       required>
            </div>

            <!-- PASSWORD 2 -->
            <div class="mb-3 input-group">
                <span class="input-group-text" onclick="togglePassword('pass2', this)">
                    <box-icon name='lock'></box-icon>
                </span>
                <input type="password" id="pass2" name="password2"
                       class="form-control"
                       placeholder="Confirmar contraseña"
                       onkeyup="checkMatch()"
                       required>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Cambiar contraseña
            </button>

        </form>

    </div>

</div>

<script>
const msg = document.getElementById("msg")

function showMessage(text, type){
    msg.innerHTML = `<div class="alert-custom ${type}">${text}</div>`
}

function togglePassword(id, el){
    let input = document.getElementById(id)
    input.type = input.type === "password" ? "text" : "password"
}

function checkMatch(){
    let p1 = pass1.value
    let p2 = pass2.value

    if(p2.length === 0) return

    if(p1 !== p2){
        showMessage("❌ Las contraseñas no coinciden", "error")
    } else {
        showMessage("✅ Coinciden", "success")
    }
}

function checkStrength(){
    let p = pass1.value

    if(p.length < 6){
        showMessage("❌ Muy corta (mínimo 6 caracteres)", "error")
    }
    else if(!/[A-Z]/.test(p) || !/[0-9]/.test(p)){
        showMessage("⚠️ Agrega mayúsculas y números", "error")
    }
    else{
        showMessage("✅ Contraseña segura", "success")
    }
}

function validarPasswords(){
    if(pass1.value !== pass2.value){
        showMessage("❌ Deben coincidir", "error")
        return false
    }
    return true
}
</script>

{% endblock %}
