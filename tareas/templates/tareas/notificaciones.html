{% extends 'base.html' %}

{% block content %}

<style>

/* CONTENEDOR GENERAL */
.notif-container {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: 40px 20px;
    min-height: calc(100vh - 90px);
}

/* HEADER */
.notif-header {
    max-width: 700px;
    margin: 0 auto 30px;
    text-align: center;
}

.notif-header-titulo {
    color: #ffffff;
    font-weight: 700;
    font-size: 28px;
    margin: 0;
}

.notif-header-icon {
    color: rgba(255,255,255,0.9);
    margin-right: 10px;
}

/* CONTENEDOR DE NOTIFICACIONES */
.notif-list {
    max-width: 700px;
    margin: 0 auto;
}

/* TARJETA DE NOTIFICACION */
.notif-card {
    background: #ffffff;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 15px;
    border-left: 5px solid #667eea;
    box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    transition: all 0.3s ease;
    animation: slideIn 0.3s ease;
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.notif-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    border-left-color: #764ba2;
}

/* CONTENIDO */
.notif-mensaje {
    color: #333;
    font-size: 15px;
    line-height: 1.5;
    margin: 0;
}

/* FECHA */
.notif-fecha {
    display: block;
    margin-top: 12px;
    font-size: 12px;
    color: #999;
}

.notif-fecha-icon {
    margin-right: 5px;
    color: #667eea;
}

/* ESTADO VACIO */
.notif-empty {
    text-align: center;
    padding: 60px 20px;
    background: rgba(255,255,255,0.1);
    border-radius: 12px;
    color: rgba(255,255,255,0.8);
}

.notif-empty-icon {
    font-size: 48px;
    margin-bottom: 15px;
    display: block;
    color: rgba(255,255,255,0.6);
}

.notif-empty-text {
    font-size: 16px;
    margin: 0;
}

/* RESPONSIVE */
@media (max-width: 600px) {
    .notif-container {
        padding: 20px 15px;
    }
    
    .notif-header-titulo {
        font-size: 22px;
    }
    
    .notif-card {
        padding: 15px;
    }
    
    .notif-mensaje {
        font-size: 14px;
    }
}

</style>

<div class="notif-container">
    
    <!-- HEADER -->
    <div class="notif-header">
        <h1 class="notif-header-titulo">
            <i class="fas fa-bell notif-header-icon"></i>Mis Notificaciones
        </h1>
    </div>

    <!-- LISTADO -->
    <div class="notif-list">
        {% if notificaciones %}
            {% for n in notificaciones %}
                <div class="notif-card">
                    <p class="notif-mensaje">{{ n.mensaje }}</p>
                    <span class="notif-fecha">
                        <i class="fas fa-clock notif-fecha-icon"></i>
                        {{ n.fecha_creacion|date:"d/m/Y H:i"|default:n.fecha|date:"d/m/Y H:i" }}
                    </span>
                </div>
            {% endfor %}
        {% else %}
            <div class="notif-empty">
                <i class="fas fa-inbox notif-empty-icon"></i>
                <p class="notif-empty-text">No tienes notificaciones aún</p>
            </div>
        {% endif %}
    </div>

</div>

{% endblock %}
