{% extends 'base.html' %}

{% block content %}

<style>

/* ===== FONDO ===== */
.error-page{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:40px 20px;

    background:linear-gradient(
        135deg,
        #0f172a 0%,
        #1e293b 100%
    );

    font-family:'Segoe UI',sans-serif;
}

/* ===== CARD ===== */
.error-card{

    width:100%;
    max-width:500px;

    background:rgba(255,255,255,0.06);

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(14px);

    border-radius:24px;

    padding:40px;

    text-align:center;

    box-shadow:0 15px 40px rgba(0,0,0,0.45);

    animation:fadeUp 0.4s ease;
}

/* ===== ICONO ===== */
.error-icon{

    font-size:70px;

    margin-bottom:20px;

    animation:pulse 2s infinite;
}

/* ===== TITULO ===== */
.error-title{

    color:#ef4444;

    font-size:34px;

    font-weight:700;

    margin-bottom:15px;
}

/* ===== TEXTO ===== */
.error-message{

    color:#cbd5e1;

    font-size:17px;

    line-height:1.7;

    margin-bottom:30px;
}

/* ===== BOTON ===== */
.btn-volver{

    display:inline-block;

    padding:12px 24px;

    border-radius:14px;

    background:linear-gradient(
        135deg,
        #3b82f6,
        #2563eb
    );

    color:white;

    text-decoration:none;

    font-weight:600;

    transition:0.3s;
}

.btn-volver:hover{

    transform:translateY(-3px);

    box-shadow:0 10px 20px rgba(59,130,246,0.4);

    color:white;
}

/* ===== ANIMACIONES ===== */

@keyframes fadeUp{

    from{
        opacity:0;
        transform:translateY(25px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes pulse{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.08);
    }

    100%{
        transform:scale(1);
    }
}

/* ===== RESPONSIVE ===== */

@media(max-width:600px){

    .error-card{

        padding:30px 20px;
    }

    .error-title{

        font-size:28px;
    }

    .error-message{

        font-size:15px;
    }
}

</style>

<div class="error-page">

    <div class="error-card">

        <div class="error-icon">
            ⚠️
        </div>

        <h3 class="error-title">
            Ocurrió un error
        </h3>

        <p class="error-message">
            {{ mensaje }}
        </p>

        <a href="javascript:history.back()"
           class="btn-volver">

            ← Volver

        </a>

    </div>

</div>

{% endblock %}
