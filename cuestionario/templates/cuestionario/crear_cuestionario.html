{% extends 'base.html' %}

{% block content %}

<style>

/* PAGE */
.page {
    background: #0f172a;
    min-height: calc(100vh - 90px);
    padding: 40px 20px;
    color: #e2e8f0;
}

/* CONTAINER */
.container {
    max-width: 850px;
    margin: auto;
}

/* HEADER */
h2 {
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    color: white;
    padding: 20px;
    border-radius: 14px;
    text-align: center;
    margin-bottom: 20px;
}

/* INPUTS */
input, textarea, select {
    width: 100%;
    padding: 10px;
    border: none;
    border-bottom: 2px solid #475569;
    background: transparent;
    color: white;
    outline: none;
}

textarea {
    resize: vertical;
}

/* ROW */
.row {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 10px;
}

.row label {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 5px;
}

/* CARD PREGUNTA */
.pregunta {
    background: rgba(255,255,255,0.05);
    padding: 20px;
    border-radius: 14px;
    margin-bottom: 15px;
    backdrop-filter: blur(10px);
}

/* OPCIONES */
.opciones {
    margin-top: 10px;
    padding-left: 10px;
    border-left: 3px solid rgba(255,255,255,0.1);
}

.opciones div {
    display: flex;
    gap: 10px;
    margin-bottom: 8px;
    align-items: center;
}

.opciones input[type="text"] {
    flex: 1;
}

/* CHECKBOX */
input[type="checkbox"] {
    width: auto;
    accent-color: #6366f1;
}

/* BOTONES */
button {
    background: linear-gradient(135deg, #22c55e, #16a34a);
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    margin-top: 10px;
}

button:hover {
    opacity: 0.9;
}

/* BOTÓN ELIMINAR */
button.delete {
    background: #ef4444;
}

/* HR */
hr {
    border: none;
    height: 1px;
    background: rgba(255,255,255,0.1);
    margin: 20px 0;
}

</style>

<div class="franja-nav"></div>

<div class="page">

<div class="container">

<h2>🧠 Crear Cuestionario</h2>

<input id="titulo" placeholder="Título">
<textarea id="descripcion" placeholder="Descripción"></textarea>

<div class="row">
    <label>
        Tiempo límite (minutos)
        <input type="number" id="tiempo">
    </label>

    <label>
        Fecha límite
        <input type="datetime-local" id="fecha_limite">
    </label>

    <label>
        Envío único
        <input type="checkbox" id="unico">
    </label>
</div>

<hr>

<div id="preguntas"></div>

<button onclick="agregarPregunta()">➕ Agregar Pregunta</button>

<hr>

<button onclick="guardar()">📌 Publicar Cuestionario</button>

</div>
</div>

<script>

let preguntas = [];

function agregarPregunta() {
    let index = preguntas.length;

    let html = `
    <div class="pregunta" id="p${index}">

        <textarea class="enunciado" placeholder="Escribe la pregunta..."></textarea>

        <textarea class="retro" placeholder="Explicación / retroalimentación"></textarea>

        <select onchange="cambiarTipo(${index}, this.value)">
            <option value="multiple">Opción única</option>
            <option value="checkbox">Casillas</option>
            <option value="texto">Texto</option>
        </select>

        <input type="number" placeholder="Puntaje">

        <div class="opciones"></div>

        <button onclick="agregarOpcion(${index})">+ Opción</button>
        <button class="delete" onclick="eliminarPregunta(${index})">❌ Eliminar</button>

    </div>
    `;

    document.getElementById('preguntas').innerHTML += html;
    preguntas.push({});
}

function agregarOpcion(i) {
    let div = document.querySelector(`#p${i} .opciones`);

    div.innerHTML += `
        <div>
            <input type="text" placeholder="Opción">
            <input type="checkbox"> Correcta
        </div>
    `;
}

function eliminarPregunta(i) {
    document.getElementById(`p${i}`).remove();
}

function guardar() {

    let preguntasHTML = document.querySelectorAll('.pregunta');
    let lista = [];

    // VALIDAR FECHA
    let fechaLimite = document.getElementById('fecha_limite').value;
    if (fechaLimite) {
        let fechaSeleccionada = new Date(fechaLimite);
        let ahora = new Date();
        if (fechaSeleccionada < ahora) {
            alert('❌ La fecha de límite no puede ser anterior a la fecha actual');
            return;
        }
    }

    preguntasHTML.forEach(p => {

        let texto = p.querySelector('.enunciado').value;
        let retro = p.querySelector('.retro').value;
        let tipo = p.querySelector('select').value;
        let puntaje = p.querySelector('input[type=number]').value;

        let opciones = [];
        let inputs = p.querySelectorAll('.opciones input');

        for (let i = 0; i < inputs.length; i += 2) {
            opciones.push({
                texto: inputs[i].value,
                correcta: inputs[i+1].checked
            });
        }

        lista.push({
            texto,
            tipo,
            puntaje,
            opciones,
            retroalimentacion: retro
        });
    });

    fetch('/cuestionario/guardar/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        },
        body: JSON.stringify({
            titulo: document.getElementById('titulo').value,
            descripcion: document.getElementById('descripcion').value,
            tiempo: document.getElementById('tiempo').value,
            unico: document.getElementById('unico').checked,
            clase_id: {{ clase_id }},
            fecha_limite: document.getElementById('fecha_limite').value,
            preguntas: lista
        })
    }).then(() => {
        alert('Guardado correctamente');
        window.location.href = "/";
    });
}

</script>

{% endblock %}
