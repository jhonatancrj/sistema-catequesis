{% extends 'base.html' %}

{% block content %}

<style>

.page {
    background: #0f172a;
    min-height: calc(100vh - 90px);
    padding: 40px 20px;
    color: #e2e8f0;
}

.container {
    max-width: 900px;
    margin: auto;
}

/* HEADER INPUTS */
input, textarea, select {
    width: 100%;
    padding: 10px;
    border: none;
    border-bottom: 2px solid #475569;
    background: transparent;
    color: white;
    outline: none;
    margin-bottom: 10px;
}

textarea {
    resize: vertical;
}

/* TITULO */
.page h2 {
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    color: white;
    padding: 20px;
    border-radius: 14px;
    text-align: center;
    margin-bottom: 20px;
}

/* CARD PREGUNTA */
.card {
    background: rgba(255,255,255,0.05);
    padding: 20px;
    border-radius: 14px;
    margin-bottom: 15px;
    backdrop-filter: blur(10px);
}

/* OPCIONES */
.opciones input {
    margin-top: 5px;
}

/* CHECKBOX */
input[type="checkbox"] {
    width: auto;
    accent-color: #6366f1;
}

/* BOTONES */
.page button {
    background: linear-gradient(135deg, #22c55e, #16a34a);
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    color: white;
    cursor: pointer;
    margin-top: 10px;
    margin-right: 5px;
}

.page button:hover {
    opacity: 0.9;
}

.page button.delete {
    background: #ef4444;
}

/* HR */
.page hr {
    border: none;
    height: 1px;
    background: rgba(255,255,255,0.1);
    margin: 20px 0;
}

</style>

<div class="page">

<div class="container">

<h2>✏️ Editar Cuestionario</h2>

<!-- INFO GENERAL -->
<input id="titulo" value="{{ cuestionario.titulo }}" placeholder="Título">
<textarea id="descripcion">{{ cuestionario.descripcion }}</textarea>

<label>⏱ Tiempo (min)</label>
<input type="number" id="tiempo" value="{{ cuestionario.tiempo_limite }}">

<label>
    <input type="checkbox" id="unico" {% if cuestionario.es_unico %}checked{% endif %}>
    Envío único
</label>

<hr>

<!-- PREGUNTAS -->
<div id="preguntas"></div>

<button onclick="agregarPregunta()">➕ Nueva Pregunta</button>

<hr>

<button onclick="guardar()">💾 Guardar Cambios</button>

</div>
</div>

<script>

let preguntas = {{ preguntas_json|safe }};

function render() {
    let cont = document.getElementById('preguntas');
    cont.innerHTML = '';

    preguntas.forEach((p, i) => {

        let html = `
        <div class="card">

            <textarea onchange="preguntas[${i}].texto=this.value">${p.texto}</textarea>

            <select onchange="preguntas[${i}].tipo=this.value">
                <option value="multiple" ${p.tipo=='multiple'?'selected':''}>Opción única</option>
                <option value="checkbox" ${p.tipo=='checkbox'?'selected':''}>Casillas</option>
                <option value="texto" ${p.tipo=='texto'?'selected':''}>Texto</option>
            </select>

            <input type="number" value="${p.puntaje}"
                onchange="preguntas[${i}].puntaje=this.value">

            <div class="opciones" id="ops${i}"></div>

            <button onclick="agregarOpcion(${i})">+ opción</button>
            <button class="delete" onclick="eliminarPregunta(${i})">❌ Eliminar</button>

        </div>
        `;

        cont.innerHTML += html;

        let opsDiv = document.getElementById(`ops${i}`);

        if (p.opciones) {
            p.opciones.forEach((op, j) => {
                opsDiv.innerHTML += `
                    <div>
                        <input value="${op.texto}"
                            onchange="preguntas[${i}].opciones[${j}].texto=this.value">

                        <input type="checkbox" ${op.correcta?'checked':''}
                            onchange="preguntas[${i}].opciones[${j}].correcta=this.checked">

                        Correcta
                    </div>
                `;
            });
        }
    });
}

function agregarPregunta() {
    preguntas.push({
        texto: '',
        tipo: 'multiple',
        puntaje: 1,
        opciones: []
    });
    render();
}

function eliminarPregunta(i) {
    preguntas.splice(i,1);
    render();
}

function agregarOpcion(i) {
    preguntas[i].opciones.push({
        texto: '',
        correcta: false
    });
    render();
}

function guardar() {

    fetch(`/cuestionario/actualizar/{{ cuestionario.id }}/`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}'
        },
        body: JSON.stringify({
            titulo: document.getElementById('titulo').value,
            descripcion: document.getElementById('descripcion').value,
            tiempo: document.getElementById('tiempo').value,
            unico: document.getElementById('unico').checked,
            preguntas: preguntas
        })
    }).then(() => {
        alert('Actualizado correctamente');
        location.reload();
    });
}

render();

</script>

{% endblock %}
