{% extends 'base.html' %}

{% block title %}Nueva Clase{% endblock %}

{% block content %}

<style>

/* 🚫 NO TOCAR NAV */
.franja-nav {
    width: 100%;
    height: 90px;
    background:
        linear-gradient(rgba(13, 40, 80, 0.7), rgba(66, 100, 148, 0.7)),
        url("/static/img/nav.png");
    background-size: cover;
    background-position: center;
}

/* FONDO */
body {
    background: linear-gradient(135deg,#0f172a 40%,#1e293b 100%);
    min-height: 100vh;
    color: #e2e8f0;
}

/* CONTENEDOR */
.contenedor-principal {
    max-width: 650px;
    margin: 0 auto;
    padding: 40px 20px;
}

/* TARJETA */
.formulario-contenedor {
    background: rgba(255,255,255,0.05);
    border-radius: 16px;
    padding: 30px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
}

/* TITULO */
h2 {
    text-align: center;
    margin-bottom: 25px;
    border-bottom: 2px solid rgba(255,255,255,0.1);
    padding-bottom: 10px;
}

/* INPUTS */
.formulario-contenedor input,
.formulario-contenedor textarea,
.formulario-contenedor select {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #475569;
    background: transparent;
    color: white;
    margin-top: 5px;
    margin-bottom: 15px;
    transition: 0.3s;
}

/* 🔥 SOLO REDUCIR TEXTAREA */
.formulario-contenedor textarea {
    min-height: 80px;   /* antes era gigante */
    max-height: 120px;
    resize: vertical;   /* permite agrandar si quieren */
}

/* FOCUS */
.formulario-contenedor input:focus,
.formulario-contenedor textarea:focus,
.formulario-contenedor select:focus {
    border-color: #6366f1;
    outline: none;
    box-shadow: 0 0 0 2px rgba(99,102,241,0.3);
}

/* BOTONES */
.botones {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 20px;
}

.btn-guardar {
    flex: 1;
    padding: 10px;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    border: none;
    border-radius: 8px;
    color: white;
    cursor: pointer;
}

.btn-volver {
    flex: 1;
    padding: 10px;
    background: #475569;
    border-radius: 8px;
    text-align: center;
    text-decoration: none;
    color: white;
}

</style>

<div class="franja-nav"></div>

<div class="contenedor-principal">

<h2>📚 Nueva Clase - {{ curso.nombre }}</h2>

<div class="formulario-contenedor">

<form method="POST">

{% csrf_token %}

{{ form.as_p }}

<div class="botones">

<button type="submit" class="btn-guardar">
💾 Guardar Clase
</button>

<a href="{% url 'clases_curso' curso.id %}" class="btn-volver">
⬅ Volver
</a>

</div>

</form>

</div>

</div>

{% endblock %}
