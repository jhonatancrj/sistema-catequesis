{% extends 'base.html' %}

{% block title %}Mi QR{% endblock %}

{% block content %}

<style>

/* CONTENEDOR GENERAL AISLADO */
.qr-page {
    background: #0f172a;
    padding: 40px 0;
    min-height: calc(100vh - 90px); /* respeta navbar */
}

/* CONTENEDOR */
.contenedor {
    max-width: 700px;
    margin: auto;
    padding: 20px;
}

/* TARJETA */
.tarjeta {
    position: relative;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(14px);
    border-radius: 18px;
    padding: 40px 30px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    transition: 0.3s ease;
}

.tarjeta:hover {
    transform: translateY(-6px);
}

/* EFECTO LUZ */
.tarjeta::before {
    content: "";
    position: absolute;
    width: 140px;
    height: 140px;
    background: rgba(59, 130, 246, 0.25);
    filter: blur(70px);
    top: -40px;
    right: -40px;
}

/* TITULO */
h2 {
    margin-bottom: 15px;
    color: #ffffff;
    font-weight: 700;
}

/* NOMBRE */
.nombre {
    font-size: 18px;
    margin-bottom: 25px;
    font-weight: 500;
    color: #cbd5e1;
}

/* QR */
.qr-img {
    border-radius: 14px;
    padding: 15px;
    background: #ffffff;
    box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    transition: 0.3s;
}

.qr-img:hover {
    transform: scale(1.05);
}

/* MENSAJE */
.mensaje {
    color: #94a3b8;
    font-size: 16px;
}

/* RESPONSIVE */
@media (max-width: 600px) {
    .tarjeta {
        padding: 30px 20px;
    }
}

</style>

<div class="franja-nav"></div>

<div class="qr-page">

<div class="contenedor">

<div class="tarjeta">

<h2>Mi QR de asistencia</h2>

<p class="nombre">
{{ request.user.first_name }} {{ request.user.last_name }}
</p>

{% if perfil.qr %}

<img src="{{ perfil.qr.url }}" width="250" class="qr-img">

{% else %}

<p class="mensaje">No tienes QR generado todavía.</p>

{% endif %}

</div>

</div>

</div>

{% endblock %}
